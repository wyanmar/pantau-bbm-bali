<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantau BBM Bali</title>
<meta name="description" content="Cek SPBU di Bali yang masih ada BBM-nya, laporan langsung dari pengendara.">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --ok: #16a34a; --ok-bg: #dcfce7;
  --bad: #dc2626; --bad-bg: #fee2e2;
  --na: #94a3b8; --ink: #0f172a; --muted: #64748b;
  --card: #fff; --line: #e2e8f0; --bg: #f8fafc;
  --shadow: 0 6px 24px rgba(15,23,42,.14);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
#map { position: fixed; inset: 0; z-index: 0; }

/* Top bar */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 500; padding: calc(10px + env(safe-area-inset-top)) 12px 0; pointer-events: none; }
.bar { pointer-events: auto; background: var(--card); box-shadow: var(--shadow); border-radius: 16px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; max-width: 520px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; flex: 1; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)} 70%{box-shadow:0 0 0 9px rgba(22,163,74,0)} 100%{box-shadow:0 0 0 0 rgba(22,163,74,0)} }
.brand small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
.chip { background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* Markers */
.mk { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 900; }
.mk.ok { background: var(--ok); }
.mk.bad { background: var(--bad); }
.mk.na { background: var(--na); }
.mk.sel { transform: scale(1.4); box-shadow: 0 0 0 4px rgba(37,99,235,.9), 0 4px 12px rgba(0,0,0,.4); }

/* Bottom sheet */
.scrim { position: fixed; inset: 0; z-index: 550; background: rgba(15,23,42,.2); opacity: 0; pointer-events: none; transition: opacity .25s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 600; left: 50%; transform: translate(-50%, 110%); bottom: 0; width: 100%; max-width: 520px; background: var(--card); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(15,23,42,.2); transition: transform .25s ease; max-height: 80vh; overflow: auto; padding: 8px 18px calc(18px + env(safe-area-inset-bottom)); }
.sheet.open { transform: translate(-50%, 0); }
.grab { width: 48px; height: 6px; border-radius: 3px; background: #cbd5e1; margin: 2px auto 10px; }
.x { position: sticky; top: 4px; float: right; width: 44px; height: 44px; border-radius: 50%; background: var(--bad); color: #fff; font-size: 22px; font-weight: 900; line-height: 44px; text-align: center; border: 3px solid #fff; }
.sheet h2 { margin: 8px 0 4px; font-size: 18px; }
.sub { color: var(--muted); font-size: 13px; }
.status { margin: 14px 0; border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: center; }
.status.ok { background: var(--ok-bg); color: #14532d; }
.status.bad { background: var(--bad-bg); color: #7f1d1d; }
.status.na { background: var(--bg); color: var(--muted); }
.status .big { font-size: 18px; font-weight: 800; }
.status .ic { font-size: 26px; }
.kv { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { font-weight: 600; }
.btn { display: block; width: 100%; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 16px; border: 0; cursor: pointer; }
.btn.nav { background: #2563eb; color: #fff; margin: 12px 0 6px; text-align: center; text-decoration: none; }
.rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.rbtn { padding: 16px; border-radius: 14px; font-weight: 800; font-size: 16px; border: 2px solid transparent; cursor: pointer; }
.rbtn.y { background: var(--ok-bg); color: #14532d; }
.rbtn.n { background: var(--bad-bg); color: #7f1d1d; }
.rbtn.sel { border-color: currentColor; }
.send { background: var(--ink); color: #fff; margin-top: 10px; }
.send:disabled { opacity: .35; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.toast { position: fixed; z-index: 700; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>

<div id="map"></div>

<div class="top">

  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab" id="grab"></div>
  <button class="x" id="close">✕</button>
  <div id="body"></div>
</div>

<div class="toast" id="toast"></div>

// ====== INIT PETA ======
const map = L.map('map', { zoomControl: true }).setView([-8.45, 115.15], 10);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 18,
  attribution: 'Tiles © Esri'
}).addTo(map);

// ====== STATE ======
let REPORTS = [];
let DEVICE = localStorage.getItem('dev') || ('anon-' + Math.random().toString(36).slice(2, 12));
localStorage.setItem('dev', DEVICE);
const markers = new Map();
const COLORS = { ok: '#16a34a', bad: '#dc2626', na: '#94a3b8' };
let FUEL = 'pertalite';

// ====== HITUNG STATUS SPBU ======
function stationState(s) {
  const mine = REPORTS.filter(r => r.station_id === s.id && r.fuel === FUEL);
  if (!mine.length) return { cls: 'na', last: null };
  
  // Laporan terbaru yang masih relevan (2 jam terakhir, dengan bobot waktu)
  const now = Date.now();
  let score = 0;
  let last = null;
  for (const r of mine) {
    const ageMin = (now - new Date(r.created_at)) / 60000;
    if (ageMin > 120) continue;
    const weight = Math.pow(0.5, ageMin / 60); // half-life 1 jam
    score += (r.available ? 1 : -1) * weight;
    if (!last || new Date(r.created_at) > new Date(last.created_at)) last = r;
  }
  
  const cls = score > 0.3 ? 'ok' : score < -0.3 ? 'bad' : 'na';
  return { cls, last };
}

// ====== RENDER MARKER ======
function icon(st) {
  const sym = st.cls === 'ok' ? '✓' : st.cls === 'bad' ? '✕' : '?';
  return L.divIcon({
    className: '',
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    html: `<div class="mk ${st.cls}">${sym}</div>`
  });
}

function render() {
  let c = { ok: 0, bad: 0, na: 0 };
  for (const s of STATIONS) {
    const st = stationState(s);
    c[st.cls]++;
    let m = markers.get(s.id);
    if (!m) {
      m = L.marker([s.lat, s.lon], { icon: icon(st) })
        .addTo(map)
        .on('click', () => openStation(s));
      markers.set(s.id, m);
    } else {
      m.setIcon(icon(st));
    }
  }
  document.getElementById('cOk').textContent = c.ok;
  document.getElementById('cBad').textContent = c.bad;
  document.getElementById('info').textContent = `${STATIONS.length} SPBU · diperbarui baru saja`;
}

// ====== BOTTOM SHEET ======
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
const body = document.getElementById('body');
let draft = { available: null };

function showSheet() { sheet.classList.add('open'); scrim.classList.add('on'); }
function hideSheet() { sheet.classList.remove('open'); scrim.classList.remove('on'); }

document.getElementById('close').onclick = hideSheet;
document.getElementById('grab').onclick = hideSheet;
scrim.onclick = hideSheet;

function ago(ms) {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 1) return 'baru saja';
  if (m < 60) return `${m} menit lalu`;
  return `${Math.round(m / 60)} jam lalu`;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

function openStation(s) {
  const st = stationState(s);
  const ic = { ok: '⛽', bad: '🚫', na: '❓' }[st.cls];
  const label = { ok: 'Kemungkinan ada BBM', bad: 'Kemungkinan kosong', na: 'Belum ada laporan' }[st.cls];
  const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=driving`;
  
  body.innerHTML = `
    <h2>${s.name}</h2>
    <div class="sub">${s.area}, ${s.reg}</div>
    <div class="status ${st.cls}">
      <div class="ic">${ic}</div>
      <div><div class="big">${label}</div>
      <div style="font-size:13px">Pertalite · ${st.last ? (st.last.available ? '✅' : '❌') + ' ' + ago(new Date(st.last.created_at)) : 'Belum ada laporan'}</div></div>
    </div>
    <a class="btn nav" href="${gmaps}" target="_blank" rel="noopener">🧭 Navigasi dengan Google Maps</a>
    <h3 style="margin:16px 0 4px;font-size:15px">Anda sedang di SPBU ini?</h3>
    <div class="rgrid">
      <button class="rbtn y ${draft.available === true ? 'sel' : ''}" data-a="1">✅ Ada BBM</button>
      <button class="rbtn n ${draft.available === false ? 'sel' : ''}" data-a="0">❌ Kosong</button>
    </div>
    <button class="btn send" id="send" ${draft.available === null ? 'disabled' : ''}>Kirim laporan</button>
    <div class="note">⚠️ Aplikasi gratis hanya untuk informasi. Status adalah perkiraan dari laporan pengguna, tidak dijamin. Risiko ditanggung pengguna.</div>
  `;
  
  body.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    draft.available = b.dataset.a === '1';
    openStation(s);
  });
  
  document.getElementById('send').onclick = () => sendReport(s);
  showSheet();
}

// ====== KIRIM LAPORAN ======
async function sendReport(s) {
  // Rate limit lokal: 1 laporan per SPBU per 10 menit
  const key = `r_${s.id}_${FUEL}`;
  try {
    const last = +localStorage.getItem(key) || 0;
    if (Date.now() - last < 10 * 60 * 1000) {
      toast('Anda sudah melapor SPBU ini barusan');
      return;
    }
  } catch (e) {}
  
  const row = {
    station_id: s.id,
    fuel: FUEL,
    available: draft.available,
    device: DEVICE
  };
  
  // Optimistic update: tampilkan dulu di peta
  REPORTS.push({ ...row, created_at: new Date().toISOString() });
  draft = { available: null };
  render();
  toast('✅ Terima kasih! Laporan Anda langsung tampil.');
  try { localStorage.setItem(key, Date.now()); } catch (e) {}
  
  // Kirim ke server
  try {
    const r = await fetch('/api/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(row)
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      if (err.error === 'rate limit') toast('Anda sudah melapor barusan');
    }
  } catch (e) {
    console.error('Gagal kirim:', e);
  }
  
  setTimeout(hideSheet, 800);
}

// ====== AMBIL LAPORAN DARI SERVER ======
async function loadReports() {
  try {
    const r = await fetch('/api/reports');
    if (!r.ok) return;
    const j = await r.json();
    const FU = ['pertalite', 'pertamax', 'solar'];
    REPORTS = (j.rows || []).map(a => ({
      id: a[0],
      station_id: a[1],
      fuel: FU[a[2]] || 'pertalite',
      available: !!a[3],
      created_at: new Date(a[4] * 1000).toISOString()
    }));
    render();
  } catch (e) {
    console.error('Gagal ambil laporan:', e);
  }
}

// ====== START ======
render();
loadReports();
setInterval(loadReports, 60000); // refresh tiap 1 menit
</script>
